# NIGHTLY EXPORT — Baserow → peanut-data.json
# Runs every night, and on demand (Actions tab → « Export Baserow » → Run workflow).
name: Export Baserow

on:
  schedule:
    - cron: '17 2 * * *' # every night at 02:17 UTC (03:17 in winter, 04:17 in summer, Swiss time)
  workflow_dispatch: # « Run workflow » button

permissions:
  contents: write # to save the new peanut-data.json in this repository

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export from Baserow
        run: node scripts/export-baserow.mjs
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
      - name: Save the file if it changed
        run: |
          git config user.name "peanut-export"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add peanut-data.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Export Baserow $(date -u +%Y-%m-%d)"
            git push
          fi
